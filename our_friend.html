<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Friend – a story about autism for kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#CDEBFF; --sky2:#E9F6FF; --grass:#86CF73; --grass2:#6BB85A;
  --sun:#FFD23F; --berry:#E8457A; --ink:#23305C; --card:#FFFFFF;
  --page:#BFE3FA; --soft:#5A6790; --ctrl:#23305C; --ctrlText:#FFFFFF;
  --font:"Fredoka", "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#141B33; --card:#1F2A4D; --ink:#F3F6FF; --soft:#B9C3E6; --ctrl:#FFD23F; --ctrlText:#23305C;
  }
}
:root[data-theme="dark"]{
  --page:#141B33; --card:#1F2A4D; --ink:#F3F6FF; --soft:#B9C3E6; --ctrl:#FFD23F; --ctrlText:#23305C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:var(--font);display:flex;justify-content:center}
.app{width:100%;max-width:980px;padding:14px;display:flex;flex-direction:column;gap:12px}
.app:fullscreen{max-width:none;background:var(--page);justify-content:center;padding:2vh 4vw}

/* stage: the scene itself stays a sunny classroom picture in both themes */
.stage{position:relative;aspect-ratio:16/9;width:100%;border-radius:28px;overflow:hidden;
  background:linear-gradient(var(--sky2),var(--sky) 70%);border:5px solid var(--ink);color:#23305C}
.ground{position:absolute;left:0;right:0;bottom:0;height:18%;background:var(--grass);border-top:6px solid var(--grass2)}
.sunblob{position:absolute;top:6%;right:5%;width:9%;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 0 10px rgba(255,210,63,.3)}
.cloud{position:absolute;background:#fff;border-radius:999px;height:7%;opacity:.95}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:45%;aspect-ratio:1;left:15%;bottom:30%}
.cloud::after{width:35%;aspect-ratio:1;left:48%;bottom:20%}
.c1{width:14%;top:10%;left:6%;animation:drift 30s linear infinite}
.c2{width:10%;top:20%;left:55%;animation:drift 40s linear infinite reverse}
@keyframes drift{from{transform:translateX(-10%)}50%{transform:translateX(40%)}to{transform:translateX(-10%)}}

.sceneTitle{position:absolute;top:4%;left:4%;z-index:5;background:#fff;color:#23305C;font-weight:700;
  font-size:clamp(14px,2.6vw,26px);padding:.25em .8em;border-radius:999px;border:3px solid #23305C;box-shadow:4px 4px 0 #23305C}
.scene{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:0 5% 6%}
.scene.enter{animation:pop .5s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

.kid{height:min(56%,330px);width:auto;overflow:visible;flex:0 0 auto}
.kid.small{height:min(40%,240px)}
.who{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tag{background:var(--sun);color:#23305C;font-weight:700;border:3px solid #23305C;border-radius:12px;padding:.1em .6em;font-size:clamp(12px,2vw,20px)}

/* step reveals, synced to narration */
.step{opacity:0;transform:scale(.7);transition:opacity .5s, transform .5s cubic-bezier(.3,1.6,.5,1)}
.step.on{opacity:1;transform:none}

/* character motion */
.kid .arm-l{transform-origin:29.5px 96px}
.kid .arm-r{transform-origin:90.5px 96px}
.kid .leg-l{transform-origin:51px 136px}
.kid .leg-r{transform-origin:68px 136px}
.kid .eyes{transform-origin:60px 57px;animation:blink 4.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wave .arm-r{animation:wave .8s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-115deg)}to{transform:rotate(-165deg)}}
.flap .arm-l{animation:flapL .26s ease-in-out infinite alternate}
.flap .arm-r{animation:flapR .26s ease-in-out infinite alternate}
@keyframes flapL{from{transform:rotate(25deg)}to{transform:rotate(75deg)}}
@keyframes flapR{from{transform:rotate(-25deg)}to{transform:rotate(-75deg)}}
.rock{animation:rock 1.1s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes rock{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.bounce{animation:bounce .55s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-6%)}}
.run .leg-l,.run .arm-r{animation:swingA .3s ease-in-out infinite alternate}
.run .leg-r,.run .arm-l{animation:swingB .3s ease-in-out infinite alternate}
@keyframes swingA{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
@keyframes swingB{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
.tap .arm-r{animation:tap .3s ease-in-out infinite alternate}
@keyframes tap{from{transform:rotate(-60deg)}to{transform:rotate(-80deg)}}
.hold .arm-l{transform:rotate(55deg)}
.hold .arm-r{transform:rotate(-55deg)}

/* speech bubbles */
.say{position:absolute;background:#fff;color:#23305C;border:3px solid #23305C;border-radius:18px;padding:.3em .7em;
  font-weight:600;font-size:clamp(12px,2.2vw,22px);white-space:nowrap;box-shadow:3px 3px 0 #23305C}
.notes{position:absolute;font-size:clamp(16px,3vw,30px);animation:float 1.6s ease-in-out infinite}
@keyframes float{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60%);opacity:0}}

/* running track */
.track{position:absolute;left:0;right:0;bottom:6%;height:58%}
.lane{position:absolute;inset:0}
.runner{position:absolute;left:0;bottom:0;width:100%;height:100%;display:flex;align-items:flex-end;
  animation:across 4.6s linear infinite;will-change:transform}
.lane.second .runner{animation-delay:-2.3s;height:88%}
.runner .kid{height:100%;width:auto;animation:bob .3s ease-in-out infinite alternate}
.speed{display:flex;flex-direction:column;gap:10px;margin:0 6px 18% 0}
.speed i{display:block;height:6px;border-radius:3px;background:#fff;opacity:.9;animation:whoosh .35s ease-in-out infinite alternate}
.speed i:nth-child(1){width:44px}.speed i:nth-child(2){width:28px;animation-delay:.1s}.speed i:nth-child(3){width:38px;animation-delay:.2s}
@keyframes across{from{transform:translateX(-30%)}to{transform:translateX(105%)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5%)}}
@keyframes whoosh{from{transform:translateX(0);opacity:.9}to{transform:translateX(-12px);opacity:.3}}

/* space bubbles */
.bubbleWrap{position:relative;display:flex;flex-direction:column;align-items:center}
.bubble{position:absolute;bottom:-4%;left:50%;width:150%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  border:4px dashed #4C8BD8;background:rgba(76,139,216,.10);transition:all .6s}
.mover{transition:transform 1.2s ease-in-out}
.at-1 .mover{transform:translateX(55%)}
.at-1 .bubble{border-color:var(--berry);background:rgba(232,69,122,.14)}
.at-3 .mover{transform:none}
.at-3 .bubble{border-color:#3BA55C;background:rgba(59,165,92,.12)}

/* cards */
.board{display:flex;flex-direction:column;gap:2.2%;align-self:center;width:52%;margin-bottom:4%}
.chip{background:#fff;color:#23305C;border:3px solid #23305C;border-radius:16px;padding:.35em .7em;font-weight:600;
  font-size:clamp(12px,2.1vw,22px);display:flex;gap:.5em;align-items:center;box-shadow:3px 3px 0 #23305C}
.chip span{font-size:1.3em}
.bigEmoji{font-size:clamp(40px,9vw,96px);line-height:1}
.sign{position:absolute;background:var(--sun);color:#23305C;border:3px solid #23305C;border-radius:14px;padding:.3em .7em;font-weight:700;font-size:clamp(12px,2.2vw,22px)}
.heart{position:absolute;bottom:20%;font-size:clamp(18px,3.5vw,38px);animation:rise 3s ease-in infinite}
@keyframes rise{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}to{transform:translateY(-280%) scale(1.1);opacity:0}}

/* caption */
.caption{background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:14px 20px;min-height:5.2em;
  display:flex;align-items:center;justify-content:center;text-align:center}
.caption p{margin:0;font-size:clamp(18px,3vw,30px);line-height:1.35;font-weight:500;max-width:34ch}
.caption p.fresh{animation:pop .35s ease-out}

/* controls */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--font);font-weight:700;font-size:clamp(15px,2vw,19px);border:3px solid var(--ink);background:var(--card);color:var(--ink);
  border-radius:999px;padding:.45em 1em;cursor:pointer;min-height:44px}
.btn.main{background:var(--ctrl);color:var(--ctrlText);min-width:7.5em}
.btn:focus-visible,input:focus-visible,select:focus-visible,.dot:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:100%}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:transparent;cursor:pointer;padding:0}
.dot.on{background:var(--berry);border-color:var(--berry)}
.dot.done{background:var(--ink)}

/* start screen */
.start{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(35,48,92,.55);padding:4%}
.startCard{background:#fff;color:#23305C;border:5px solid #23305C;border-radius:26px;padding:clamp(14px,3vw,30px);
  max-width:520px;width:100%;text-align:center;box-shadow:8px 8px 0 #23305C;max-height:100%;overflow:auto}
.startCard h1{margin:0 0 .2em;font-size:clamp(24px,4.6vw,44px);line-height:1.1}
.startCard p{margin:.2em 0 .9em;color:#5A6790;font-size:clamp(14px,1.9vw,18px)}
.field{display:flex;flex-direction:column;gap:4px;text-align:left;margin:0 auto 10px;max-width:340px;font-weight:600;font-size:15px}
.field input,.field select{font-family:var(--font);font-size:18px;padding:.4em .6em;border:3px solid #23305C;border-radius:12px;background:#fff;color:#23305C;width:100%}
.startCard .btn{background:var(--berry);color:#fff;border-color:#23305C;font-size:clamp(18px,2.6vw,24px);margin-top:6px}
.hidden{display:none !important}
.genderPick{border:none;padding:0}
.genderPick legend{padding:0;margin-bottom:4px}
.gRow{display:flex;gap:8px;flex-wrap:wrap}
.gOpt{flex:1 1 140px;display:flex;align-items:center;gap:6px;border:3px solid #23305C;border-radius:12px;padding:.35em .6em;cursor:pointer;font-size:16px}
.gOpt:has(input:checked){background:var(--sun)}
.gOpt input{accent-color:#E8457A;width:18px;height:18px}
.note{font-size:14px;color:var(--soft);text-align:center;margin:0}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0s !important;animation-iteration-count:1 !important}
  .runner{transform:translateX(20%) !important}.lane.second .runner{transform:translateX(55%) !important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage" aria-live="off">
    <div class="sunblob"></div><div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="ground"></div>
    <div class="sceneTitle" id="sceneTitle">Our Friend</div>
    <div id="sceneHost"></div>

    <div class="start" id="start">
      <div class="startCard">
        <h1>Meet our friend!</h1>
        <p>A short story with a reading voice, made for kids.</p>
        <label class="field">Classmate's name
          <input id="nameInput" type="text" maxlength="20" value="Leo" autocomplete="off">
        </label>
        <fieldset class="field genderPick">
          <legend>Our classmate is a…</legend>
          <div class="gRow">
            <label class="gOpt"><input type="radio" name="gender" value="boy" checked> 👦 Boy (he / him)</label>
            <label class="gOpt"><input type="radio" name="gender" value="girl"> 👧 Girl (she / her)</label>
          </div>
        </fieldset>
        <label class="field">Talking speed
          <select id="speedSelect">
            <option value="0.92">A little slower</option>
            <option value="1" selected>Normal</option>
            <option value="1.08">A little faster</option>
          </select>
        </label>
        <label class="field">Reading voice
          <select id="voiceSelect"><option value="">Default voice</option></select>
        </label>
        <button class="btn" id="startBtn">▶ Start the video</button>
      </div>
    </div>
  </div>

  <div class="caption" aria-live="polite"><p id="captionText">Press “Start the video” to begin.</p></div>

  <div class="controls">
    <button class="btn" id="prevBtn" aria-label="Previous part">◀ Back</button>
    <button class="btn main" id="playBtn">▶ Play</button>
    <button class="btn" id="nextBtn" aria-label="Next part">Next ▶</button>
    <button class="btn" id="muteBtn" aria-label="Turn voice off">🔊 Voice on</button>
    <button class="btn" id="fullBtn" aria-label="Full screen">⛶ Full screen</button>
    <div class="dots" id="dots"></div>
  </div>
  <p class="note">Tip: use full screen on the classroom board. Space bar plays and pauses; arrow keys move between parts.</p>
</div>

<script>
/* ---------- character drawing ---------- */
function kid(o){
  o = o || {};
  var skin=o.skin||'#F2C9A0', hair=o.hair||'#5B3A29', shirt=o.shirt||'#4FA3F7', pants=o.pants||'#3B4A6B';
  var style=o.style||'short', cls=o.cls||'';
  var back='', front='';
  if(style==='short'){ front='<path d="M27 58 Q24 20 60 19 Q96 20 93 58 Q88 36 60 34 Q33 36 27 58Z" fill="'+hair+'"/>'; }
  if(style==='long'){ back='<rect x="24" y="40" width="72" height="56" rx="20" fill="'+hair+'"/>';
    front='<path d="M27 58 Q24 20 60 19 Q96 20 93 58 Q86 40 60 32 Q34 40 27 58Z" fill="'+hair+'"/>'; }
  if(style==='curly'){ front=[[30,44],[38,30],[52,22],[68,22],[82,30],[90,44],[60,28]].map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="12" fill="'+hair+'"/>';}).join(''); }
  if(style==='puffs'){ back='<circle cx="28" cy="30" r="15" fill="'+hair+'"/><circle cx="92" cy="30" r="15" fill="'+hair+'"/>';
    front='<path d="M28 56 Q26 22 60 22 Q94 22 92 56 Q86 38 60 36 Q34 38 28 56Z" fill="'+hair+'"/>'; }
  var star = o.star ? '<text x="60" y="126" text-anchor="middle" font-size="26" fill="#FFD23F" stroke="#23305C" stroke-width="1.5">★</text>' : '';
  var mouth = o.open ? '<ellipse cx="60" cy="73" rx="7" ry="6" fill="#7A2E3A"/>' : '<path d="M49 70 Q60 80 71 70" stroke="#2b2b2b" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
  return '<svg class="kid '+cls+'" viewBox="0 0 120 200" aria-hidden="true">'+
    '<g class="leg-l"><rect x="44" y="134" width="14" height="48" rx="7" fill="'+pants+'"/><ellipse cx="49" cy="184" rx="12" ry="6.5" fill="#2E2E3A"/></g>'+
    '<g class="leg-r"><rect x="62" y="134" width="14" height="48" rx="7" fill="'+pants+'"/><ellipse cx="71" cy="184" rx="12" ry="6.5" fill="#2E2E3A"/></g>'+
    '<g class="arm-l"><rect x="23" y="92" width="13" height="42" rx="6.5" fill="'+shirt+'"/><circle cx="29.5" cy="136" r="7.5" fill="'+skin+'"/></g>'+
    '<g class="arm-r"><rect x="84" y="92" width="13" height="42" rx="6.5" fill="'+shirt+'"/><circle cx="90.5" cy="136" r="7.5" fill="'+skin+'"/></g>'+
    '<rect x="34" y="86" width="52" height="58" rx="17" fill="'+shirt+'"/>'+ star + back +
    '<circle cx="60" cy="56" r="32" fill="'+skin+'"/>'+ front +
    '<g class="eyes"><circle cx="49" cy="57" r="4.2" fill="#2b2b2b"/><circle cx="71" cy="57" r="4.2" fill="#2b2b2b"/></g>'+
    '<circle cx="41" cy="67" r="5.5" fill="#FF8FA3" opacity=".55"/><circle cx="79" cy="67" r="5.5" fill="#FF8FA3" opacity=".55"/>'+
    mouth + '</svg>';
}
// The classmate: always the star shirt so kids can spot him
function hero(cls, extra){ return kid(Object.assign({shirt:'#F28C28',pants:'#2F5D8C',hair:'#3B2A20',style:(gender==='girl'?'long':'short'),star:true,cls:cls||''}, extra||{})); }
var friendA = function(c){ return kid({skin:'#8D5A3B',hair:'#1E1410',style:'puffs',shirt:'#9B6BDB',pants:'#E8457A',cls:c||''}); };
var friendB = function(c){ return kid({skin:'#F6D7B8',hair:'#E0A33A',style:'long',shirt:'#3BA55C',pants:'#23305C',cls:c||''}); };
var friendC = function(c){ return kid({skin:'#C68A5E',hair:'#2A1B12',style:'curly',shirt:'#E8457A',pants:'#3B4A6B',cls:c||''}); };

/* ---------- the story ---------- */
var scenes = [
 { title:'Meet our friend', lines:[
   'Hi friends! Today we are going to learn about someone special in our class.',
   'This is {n}! {He} is our classmate, and {he} is autistic.',
   'Let’s find out what that means, so we can all be great friends!'],
   draw:function(n){ return '<div class="who bounce step" data-s="1">'+hero('wave')+'<div class="tag">'+n+'</div></div>'+
     '<div class="who step" data-s="2" style="margin-left:4%">'+friendA('wave')+'</div>'+
     '<div class="who step" data-s="2">'+friendB('wave')+'</div>'; } },

 { title:'Every brain is different', lines:[
   'Every person has a brain, and every brain works a little bit differently.',
   'Some people love chocolate ice cream. Some people love vanilla. Both are great!',
   'Autism is one way a brain can work. It is not a sickness, and you can’t catch it.',
   '{His} brain might notice sounds, lights and feelings in a really big way.'],
   draw:function(n){ return '<div class="who">'+hero('')+'<div class="tag">'+n+'</div></div>'+
     '<div class="board">'+
       '<div class="chip step" data-s="0"><span>🧠</span> Every brain is a little different</div>'+
       '<div class="chip step" data-s="1"><span>🍫</span> Chocolate or <span>🍦</span> vanilla? Both are great!</div>'+
       '<div class="chip step" data-s="2"><span>💚</span> Autism is not a sickness. You can’t catch it.</div>'+
       '<div class="chip step" data-s="3"><span>🔊</span><span>💡</span><span>💛</span> Sounds, lights and feelings feel BIG</div>'+
     '</div>'; } },

 { title:'Saying things again', lines:[
   'Sometimes {n} might say the same words, or ask the same question, again and again.',
   'Like… Is it lunchtime? Is it lunchtime? Is it lunchtime?',
   'Saying things again helps {him} feel safe and calm. It’s a bit like singing your favourite song over and over.',
   'You can answer kindly, even if {he} already asked. And we never laugh at {him}, or copy {him} to tease.'],
   draw:function(n){ return '<div class="who" style="margin-right:22%">'+hero('', {open:true})+'<div class="tag">'+n+'</div>'+
     '<div class="say step" data-s="1" style="left:85%;top:-6%">Is it lunchtime?</div>'+
     '<div class="say step" data-s="1" style="left:105%;top:14%;transition-delay:.6s">Is it lunchtime?</div>'+
     '<div class="say step" data-s="1" style="left:90%;top:34%;transition-delay:1.2s">Is it lunchtime? 🥪</div>'+
     '</div>'+
     '<div class="who step" data-s="3">'+friendB('')+'<div class="say" style="right:70%;top:-14%">Yes, soon! 😊</div></div>'; } },

 { title:'Lots and lots of energy', lines:[
   '{n}’s body has lots and lots of energy!',
   'Sometimes {he} needs to run, jump, or move around. Moving helps {his} body and {his} brain feel good.',
   'At recess, you could play a running game with {him}, like tag, or a race!',
   'But if {he} runs somewhere that isn’t safe, like out the door or near the road, tell a grown-up right away.'],
   draw:function(n){ var sp='<div class="speed"><i></i><i></i><i></i></div>';
     return '<div class="track">'+
       '<div class="lane"><div class="runner">'+sp+hero('run')+'</div></div>'+
       '<div class="lane second step" data-s="2"><div class="runner">'+sp+friendA('run')+'</div></div>'+
     '</div>'+
     '<div class="sign step" data-s="3" style="top:20%;left:32%">⚠️ Not safe? Tell a grown-up!</div>'; } },

 { title:'Stimming', lines:[
   'Some autistic kids flap their hands, rock back and forth, spin, or hum.',
   'This is called stimming. Can you say it? Stim… ming!',
   'Guess what? Everybody stims a little bit. Like tapping your pencil, bouncing your leg, or twirling your hair.',
   'Stimming helps {him} feel calm, or show that {he}’s happy and excited.',
   'So it’s okay! We don’t need to stop {him} or stare at {him}. We just let {him} be {himself}.'],
   draw:function(n){ return '<div class="who">'+hero('flap')+'<div class="tag">Flap</div></div>'+
     '<div class="who">'+hero('rock')+'<div class="tag">Rock</div></div>'+
     '<div class="who">'+hero('')+'<div class="notes" style="left:70%;top:5%">🎵</div><div class="notes" style="left:85%;top:15%;animation-delay:.8s">🎶</div><div class="tag">Hum</div></div>'+
     '<div class="who step" data-s="2" style="margin-left:3%">'+friendC('tap small')+'<div class="tag">✏️ Me too!</div></div>'+
     '<div class="sign step" data-s="1" style="top:20%;left:38%">Stim‑ming!</div>'; } },

 { title:'Personal space bubbles', lines:[
   'Imagine everybody has an invisible bubble around them. This is called personal space.',
   'Sometimes {n} might forget about bubbles. {He} might stand very close, give a surprise hug, or touch your things.',
   '{He} isn’t trying to be mean. {He}’s still learning about bubbles, just like we all learn new things.',
   'You can say in a kind voice: Can I have a little space, please?',
   'And remember, {he} might not like being touched. So always ask first: Can I give you a high five?'],
   draw:function(n){ return '<div class="bubbleWrap mover"><div class="bubble"></div>'+hero('')+'<div class="tag">'+n+'</div></div>'+
     '<div class="bubbleWrap" style="margin-left:14%"><div class="bubble"></div>'+friendA('')+
       '<div class="say step" data-s="3" style="right:60%;top:-16%">Can I have a little space, please? 😊</div>'+
       '<div class="say step" data-s="4" style="right:60%;top:-16%;background:var(--sun)">Can I give you a high five? ✋</div>'+
     '</div>'; } },

 { title:'{n} loves friends!', lines:[
   'Here is the most important thing to remember: {n} loves having friends!',
   '{He} likes to talk and to play, even if {he} does it in {his} own special way.',
   'So, say hi, and use {his} name.',
   'Ask {him} to come and play with you.',
   'Talk about the things {he} loves.',
   'And be patient. Sometimes {he} needs a little extra time to answer.'],
   draw:function(n){ return '<div class="who">'+hero('wave bounce')+'<div class="tag">'+n+'</div></div>'+
     '<div class="board">'+
       '<div class="chip step" data-s="2"><span>👋</span> Say hi and use {his} name</div>'+
       '<div class="chip step" data-s="3"><span>⚽</span> Ask {him} to play with you</div>'+
       '<div class="chip step" data-s="4"><span>🚂</span> Talk about the things {he} loves</div>'+
       '<div class="chip step" data-s="5"><span>⏳</span> Be patient and give {him} time</div>'+
     '</div>'; } },

 { title:'Let’s be friends!', lines:[
   'Remember: different is not wrong. Different is just different!',
   'We all need a little help sometimes, and we can all be helpers.',
   'When we are kind, everyone gets to belong.',
   'So… will you be {n}’s friend? Yay! Thanks for watching!'],
   draw:function(n){ return friendA('hold')+hero('hold bounce')+friendB('hold')+friendC('hold')+
     ['10%','28%','50%','70%','88%'].map(function(l,i){return '<div class="heart" style="left:'+l+';animation-delay:'+(i*0.6)+'s">'+['💛','💜','💚','❤️','💙'][i]+'</div>';}).join('')+
     '<div class="sign step" data-s="3" style="top:22%;left:50%;transform:translateX(-50%)">🌈 Different is not wrong!</div>'; } }
];

/* ---------- player ---------- */
var $ = function(id){ return document.getElementById(id); };
var name='Leo', gender='boy', speed=1.0, sc=0, li=0, playing=false, muted=false, token=0, timers=[], voice=null, voices=[];
var hasSpeech = 'speechSynthesis' in window;

var PRONOUNS={
  boy:{he:'he',He:'He',him:'him',his:'his',His:'His',himself:'himself'},
  girl:{he:'she',He:'She',him:'her',his:'her',His:'Her',himself:'herself'}
};
function fill(t){
  var p=PRONOUNS[gender];
  return t.replace(/\{n\}/g, name).replace(/\{(he|He|him|his|His|himself)\}/g, function(m,k){ return p[k]; });
}
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
function readTime(t){ return Math.max(2200, t.split(/\s+/).length * 420); }

function renderDots(){
  $('dots').innerHTML = scenes.map(function(s,i){
    return '<button class="dot '+(i===sc?'on':(i<sc?'done':''))+'" aria-label="Go to part '+(i+1)+': '+fill(s.title)+'" data-i="'+i+'"></button>';
  }).join('');
}
function renderScene(){
  var s=scenes[sc];
  $('sceneTitle').textContent = fill(s.title);
  $('sceneHost').innerHTML = '<div class="scene enter" id="scene">'+fill(s.draw(name))+'</div>';
  renderDots(); applySteps();
}
function applySteps(){
  var root=$('scene'); if(!root) return;
  for(var k=0;k<=li;k++) root.classList.add('at-'+k);
  root.querySelectorAll('.step').forEach(function(el){ el.classList.toggle('on', li >= +el.dataset.s); });
  var p=$('captionText'); p.textContent = fill(scenes[sc].lines[Math.min(li, scenes[sc].lines.length-1)]);
  p.classList.remove('fresh'); void p.offsetWidth; p.classList.add('fresh');
}
function speakLine(){
  clearTimers();
  var lines=scenes[sc].lines;
  if(li>=lines.length) li=lines.length-1;
  var my=++token; applySteps();
  var text=fill(lines[li]);
  var done=function(){ if(my!==token||!playing) return; token++; advance(); };
  if(!muted && hasSpeech){
    try{
      var u=new SpeechSynthesisUtterance(text.replace(/…/g,', '));
      if(voice) u.voice=voice;
      u.lang = voice ? voice.lang : 'en-US';
      u.rate=speed; u.pitch=1.0;
      u.onend=function(){ later(done,250); };
      u.onerror=function(){ later(done,600); };
      speechSynthesis.speak(u);
      later(done, readTime(text)*2.5+4000); // safety net if the browser never reports the end
    }catch(e){ later(done, readTime(text)); }
  } else later(done, readTime(text));
}
function advance(){
  if(li < scenes[sc].lines.length-1){ li++; speakLine(); return; }
  if(sc < scenes.length-1){ var my=token; later(function(){ if(my!==token||!playing) return; goScene(sc+1); }, 600); }
  else { playing=false; updatePlay(); $('playBtn').textContent='↺ Watch again'; }
}
function goScene(i){
  stopSpeech(); sc=Math.max(0,Math.min(scenes.length-1,i)); li=0; renderScene();
  if(playing) speakLine();
}
function stopSpeech(){ token++; clearTimers(); if(hasSpeech) try{speechSynthesis.cancel();}catch(e){} }
function play(){
  if(sc===scenes.length-1 && li===scenes[sc].lines.length-1 && !playing && $('playBtn').textContent.indexOf('again')>-1){ playing=true; updatePlay(); goScene(0); return; }
  playing=true; updatePlay(); speakLine();
}
function pause(){ playing=false; stopSpeech(); updatePlay(); }
function updatePlay(){ $('playBtn').textContent = playing ? '⏸ Pause' : '▶ Play'; }

/* voices */
function loadVoices(){
  if(!hasSpeech) return;
  voices = speechSynthesis.getVoices().filter(function(v){ return /^en[-_]/i.test(v.lang); });
  if(!voices.length) return;
  var prefs=['Natural','Microsoft Aria','Microsoft Jenny','Microsoft Ava','Samantha','Ava','Allison','Karen','Moira','Microsoft Zira','Google UK English Female','Google US English'];
  var best=null;
  for(var i=0;i<prefs.length && !best;i++) best=voices.find(function(v){return v.name.indexOf(prefs[i])>-1;})||null;
  if(!voice) voice=best||voices[0];
  $('voiceSelect').innerHTML = voices.map(function(v,i){ return '<option value="'+i+'"'+(v===voice?' selected':'')+'>'+v.name+' ('+v.lang+')</option>'; }).join('');
}
if(hasSpeech){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
else { $('voiceSelect').innerHTML='<option>Voice not available in this browser</option>'; $('voiceSelect').disabled=true; }
$('speedSelect').addEventListener('change', function(e){ speed=+e.target.value||1; });
$('voiceSelect').addEventListener('change', function(e){ voice=voices[+e.target.value]||null; });

/* controls */
$('startBtn').addEventListener('click', function(){
  var g=document.querySelector('input[name="gender"]:checked'); gender = g ? g.value : 'boy';
  var v=$('nameInput').value.trim(); name = v ? v.charAt(0).toUpperCase()+v.slice(1) : 'Leo';
  $('start').classList.add('hidden'); sc=0; li=0; renderScene(); playing=true; updatePlay(); speakLine();
});
$('nameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') $('startBtn').click(); });
$('playBtn').addEventListener('click', function(){ if(!$('start').classList.contains('hidden')){ $('startBtn').click(); return; } playing?pause():play(); });
$('prevBtn').addEventListener('click', function(){ if(!$('start').classList.contains('hidden')) return; goScene(sc-1); });
$('nextBtn').addEventListener('click', function(){ if(!$('start').classList.contains('hidden')) return; goScene(sc+1); });
$('dots').addEventListener('click', function(e){ var i=e.target.dataset && e.target.dataset.i; if(i!==undefined && $('start').classList.contains('hidden')) goScene(+i); });
$('muteBtn').addEventListener('click', function(){
  muted=!muted; this.textContent = muted ? '🔇 Voice off' : '🔊 Voice on';
  this.setAttribute('aria-label', muted ? 'Turn voice on' : 'Turn voice off');
  if(playing){ stopSpeech(); speakLine(); }
});
$('fullBtn').addEventListener('click', function(){
  var a=$('app');
  if(document.fullscreenElement) document.exitFullscreen();
  else if(a.requestFullscreen) a.requestFullscreen().catch(function(){});
  else if(a.webkitRequestFullscreen) a.webkitRequestFullscreen();
});
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(!$('start').classList.contains('hidden')) return;
  if(e.code==='Space'){ e.preventDefault(); playing?pause():play(); }
  if(e.key==='ArrowRight') goScene(sc+1);
  if(e.key==='ArrowLeft') goScene(sc-1);
});

/* first paint behind the start card */
renderScene(); $('captionText').textContent='Type the classmate’s name, then press “Start the video”.';
</script>
</body>
